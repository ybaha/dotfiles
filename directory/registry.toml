# Single source of truth for http://agents/. Edit this, then run `~/code/dotfiles/directory/deploy`.
# `{tailnet}` is replaced at build time from TAILNET in ~/.config/pi-agent/local.env (keeps the tailnet name out of git).
# NEVER put secrets here - only the *location* of credentials. `verified` says how sure we are.

[directory]
title = "Home cluster directory"
base_url = "http://agents"
https_url = "https://agents.{tailnet}"
summary = """A small self-hosted setup: one Proxmox host (`home`) running LXC containers and VMs, all reachable only over Tailscale. \
Nothing here is on the public internet. If you can read this page, your device is on the tailnet."""
conventions = [
  "Everything is tailnet-only. There is no public ingress; do not try to expose anything.",
  "Services with an API use `Authorization: Bearer <token>`. Tokens are never published here; the 'auth' field of each service says where yours lives.",
  "Never copy tokens or secrets into prompts, repos, logs or chat. Read them from the file at runtime.",
  "Read-only first: prefer GET endpoints. Do not restart, delete or modify containers on `home` unless the owner asked.",
  "Times are UTC in APIs unless a field says otherwise; the owner's timezone is Europe/Amsterdam.",
  "`verified` on a service: `live` = checked against the running service; `inferred` = guessed from names/config, confirm with the owner before relying on it.",
]

[[service]]
id = "air-sync"
tags = ["api", "health", "data"]
name = "Fitbit Air health data (air-sync)"
purpose = "Owner's personal health data from a Fitbit Air via the Google Health API: heart rate (intraday), steps, calories, distance, activity minutes, battery, weight/BMI; sleep, HRV, SpO2, resting HR, HR zones, breathing rate, skin temp and exercise sessions once recorded. Query it to answer questions about the owner's activity, sleep and recovery."
status = "running"
verified = "live"
host = "CT 108 `fitbit-health` on `home`, Rust + SQLite, ~4 MB RAM"
url = "https://fitbit-health.{tailnet}"
auth = "Bearer token. Workstation: `. ~/.config/fitbit-air/agent.env` sets `AIR_URL` and `AIR_API_TOKEN`. Server copy: `/etc/air-sync.env` in CT 108."
health_url = "https://fitbit-health.{tailnet}/healthz"
start_here = "GET /v1/summary?days=7 for a per-day overview; GET /v1/measurements to see what exists; GET /v1/points for raw rows."
endpoints = [
  "GET /healthz - no auth; {ok, db_points, version}",
  "GET /v1/summary?days=N - per-day steps, calories, distance, hr_min/avg/max, activity minutes, resting_hr, hrv, spo2, breathing, skin temp (null when not recorded)",
  "GET /v1/points?measurement=NAME&from=&to=&limit=&order= - raw points; `from` inclusive, `to` exclusive, dates `YYYY-MM-DD` (Europe/Amsterdam) or RFC3339",
  "GET /v1/latest?measurement=NAME - newest point",
  "GET /v1/measurements - names with counts and first/last timestamps",
  "GET /v1/status - sync job health, token state, device battery and last sync",
  "POST /v1/sync?job=all - trigger an immediate sync (the only write; safe)",
]
example = [
  '. ~/.config/fitbit-air/agent.env',
  'curl -s -H "Authorization: Bearer $AIR_API_TOKEN" "$AIR_URL/v1/summary?days=7"',
  'curl -s -H "Authorization: Bearer $AIR_API_TOKEN" "$AIR_URL/v1/points?measurement=HeartRate_Intraday&from=2026-11-11&limit=500"',
]
gotchas = [
  "Measurement names match the old fitbit-grafana schema and contain spaces (`Total Steps`, `Activity Minutes`); URL-encode with `+` or `%20`.",
  "Sleep/HRV/SpO2/resting HR/HR zones/activities were ported but unverified against real data until the device has recorded several nights (see docs/UNVERIFIED.md in the repo).",
  "Today's calories/steps are in progress and change minute to minute.",
  "Google refresh token may expire ~7 days after consent; if /v1/status shows token or sync errors, the owner must re-consent (runbook below).",
]
docs = [
  ["API reference", "~/code/air-sync/docs/API.md"],
  ["Operations runbook", "~/code/air-sync/docs/OPERATIONS.md"],
]

[[service]]
id = "previews"
tags = ["web", "dev"]
name = "Project previews (previewctl dashboard)"
purpose = "Temporary (24h TTL) HTTPS previews of work-in-progress projects on the dev workstation, each on its own port, with a dashboard listing them. Look here for a dev front end the owner just asked an agent to publish."
status = "running"
verified = "live"
host = "Workstation `dell` (tailnet node `dell`), managed by `previewctl` (dotfiles skill `/preview`)."
url = "https://dell.{tailnet}/"
health_url = "https://dell.{tailnet}/"
auth = "Tailnet only."
start_here = "`previewctl list` prints every live preview with its URL; `previewctl up` publishes the current project."
gotchas = ["Entries are ephemeral and expire after 24h unless refreshed; do not hard-code their URLs."]

[[service]]
id = "nextcloud"
tags = ["web", "files"]
name = "Nextcloud (files, calendar, AI-Inbox)"
purpose = "Owner's personal cloud: files, contacts, calendar. Contains an `AI-Inbox` folder where documents for phone review are placed."
status = "running"
verified = "inferred"
host = "CT 101 `NextCloud` on `home` (snap Nextcloud + MySQL; 4 cores, 8 GB, 240 GB disk). Also exposes Samba (445)."
url = "https://home.{tailnet}"
auth = "Per-user Nextcloud login/app password; ask the owner. Not provided here."
health_url = "https://home.{tailnet}/status.php"
start_here = "WebDAV at /remote.php/dav/files/<user>/ with an app password; /status.php for health."
endpoints = ["GET /status.php - health, no auth", "WebDAV /remote.php/dav/files/<user>/ - needs app password"]
gotchas = ["Served by the Proxmox host's Tailscale on the host's own name (`home`), not its own node."]

[[service]]
id = "immich"
tags = ["web", "photos"]
name = "Immich (photos)"
purpose = "Photo and video library with machine-learning search."
status = "running"
verified = "inferred"
host = "Docker inside CT 101 (immich_server, machine_learning, postgres, valkey)."
url = "https://home.{tailnet}:2283"
auth = "Immich account / API key created in the Immich UI; ask the owner."
health_url = "https://home.{tailnet}:2283/api/server/ping"
