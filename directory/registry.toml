[[service]]
id = "life-hq"
tags = ["web", "dashboard"]
name = "Life HQ dashboard"
purpose = "Owner's live personal dashboard (backend + static web UI)."
status = "running"
verified = "inferred"
host = "CT 107 `life-hq` on `home` (Python `lifehq serve`, SQLite, 512 MB). Peer-restricted: only allowed source IPs may call it."
url = "https://home.{tailnet}:8445"
auth = "Network allow-list (`LIFEHQ_ALLOWED_PEERS`) plus its own config under `/etc/life-hq/` in CT 107 (contains secrets; do not read or copy)."
start_here = "Open the URL in a browser; ask the owner before scripting against it."
